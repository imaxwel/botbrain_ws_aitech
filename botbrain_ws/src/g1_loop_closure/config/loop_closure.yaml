/**:
  ros__parameters:
    # Default is observation-only. Mapping launch enables diagnostic pose-graph
    # optimization, while its live map->camera_init correction remains an
    # explicit FAST_LIO_LOOP_LIVE_CORRECTION=true experiment. Never enable that
    # TF in parallel with localization_3d.
    cloud_topic: /cloud_registered_1
    odom_topic: /Odometry_loc
    world_frame: camera_init
    odom_sync_tolerance_sec: 0.035
    odom_history_size: 300

    # Keep the Jetson work bounded. A keyframe contains a voxel-filtered local
    # cloud and is queried at most once every query_interval_sec seconds.
    keyframe_distance_m: 1.5
    keyframe_yaw_deg: 15.0
    keyframe_time_sec: 2.0
    keyframe_voxel_m: 0.20
    keyframe_max_points: 5000
    # Separate, denser gravity-aligned world cloud used only for online grid
    # replay and optimized PCD export. Never rebuild a map from the small
    # body-frame descriptor cloud, because that would bake robot tilt into Z.
    mapping_keyframe_voxel_m: 0.10
    mapping_keyframe_max_points: 12000
    max_keyframes: 800
    query_interval_sec: 5.0
    min_loop_time_sec: 30.0
    min_loop_path_distance_m: 20.0
    # A corridor loop must return near a previously visited raw FAST-LIO pose.
    # This rejects visually identical bays that are several metres apart.
    candidate_max_raw_separation_m: 4.0
    candidate_max_raw_z_difference_m: 0.30

    # Scan-Context-like polar descriptor. Geometric ICP must independently
    # validate every descriptor match before it becomes a pose-graph edge.
    descriptor_rings: 20
    descriptor_sectors: 60
    descriptor_max_range_m: 25.0
    descriptor_min_similarity: 0.82

    # Strict loop-verification gate. These values are deliberately tighter
    # than a global-relocalization search to reject repeated corridor bays.
    icp_max_correspondence_m: 0.80
    icp_max_iterations: 60
    icp_max_fitness_m: 0.18  # RMS correspondence distance in metres
    icp_min_inlier_ratio: 0.35
    icp_max_translation_m: 8.0
    icp_max_z_translation_m: 0.40
    # This is the true candidate->current relative heading. An out-and-back
    # corridor loop is 180 degrees; false ICP rotation is instead bounded by
    # icp_max_odom_delta_yaw_deg below.
    icp_max_yaw_deg: 180.0
    icp_max_roll_pitch_deg: 15.0
    # ICP must not jump several repeated corridor sections away from the
    # FAST-LIO prediction, even if that section has an apparently good score.
    icp_max_odom_delta_m: 3.0
    icp_max_odom_delta_yaw_deg: 25.0
    # Never let one repeated-corridor match move map->camera_init. Three
    # consecutive verified loop observations must imply nearly the same
    # global correction before their edges enter the pose graph.
    loop_confirmation_count: 3
    loop_confirmation_max_translation_m: 0.75
    loop_confirmation_max_yaw_deg: 8.0

    # The standalone loop_closure Compose profile starts in phase 1. Setting
    # only this parameter true activates diagnostic graph optimization and
    # still emits no TF. The FAST-LIO mapping launch enables it by default;
    # live correction remains opt-in through its environment variable.
    enable_pose_graph: false

    # Graph outputs are always published as /loop_closure/optimized_path and
    # map_preview. A TF is emitted only when publish_live_correction is also
    # explicitly true; navigation localization owns that TF in navigation mode,
    # so the mapping instance is not started there.
    optimizer_iterations: 8
    odom_edge_xy_weight: 1.0
    odom_edge_yaw_weight: 2.0
    loop_edge_xy_weight: 8.0
    loop_edge_yaw_weight: 10.0
    map_preview_max_points: 250000
    export_optimized_map_path: ""

    # Online outputs are disabled for standalone/navigation use. Mapping mode
    # enables the graph but keeps this false unless a live-TF experiment is
    # explicitly requested. Corrected scan/odom streams remain an explicit
    # diagnostic option; the live grid uses dense FAST-LIO scans so floor
    # classification and CPU load stay predictable.
    publish_live_correction: false
    map_frame: map
    body_frame: body
    correction_smoothing_sec: 2.0
    publish_corrected_streams: false
    corrected_cloud_topic: /loop_closure/cloud_registered
    corrected_odom_topic: /loop_closure/odometry
    # Publish one complete corrected FAST-LIO world scan out of every three.
    # Replayed keyframes are not decimated by grid_accumulator.
    corrected_stream_every_n_scans: 3
